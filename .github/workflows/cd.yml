name: FastAPI CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образу, який пройшов CI: sha-FULL_SHA"
        required: true
        default: "sha-ba6216e39cf8f81dee0bcdda25214dc7d9d7dd65"
        type: string

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: cloud-teh-lab6-rg
      CONTAINER_APP: cloud-teh-api
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - name: Validate image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "Expected sha- followed by the full 40-character commit SHA."
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy existing GHCR image
        shell: bash
        run: |
          az extension add --name containerapp --upgrade

          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "ghcr.io/straicy/cloud-teh_lab5-6:$IMAGE_TAG" \
            --output none

      - name: Get application URL
        shell: bash
        run: |
          HOST=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          test -n "$HOST"
          echo "APP_URL=https://$HOST" >> "$GITHUB_ENV"

      - name: Smoke test
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
                --max-time 20 \
                "$APP_URL/common/healthcheck" \
                --output response.json; then
              if python -c 'import json; assert json.load(open("response.json"))["status"] == "ok"'; then
                echo "Smoke test passed."
                exit 0
              fi
            fi
            echo "Attempt $attempt failed; retrying..."
            sleep 10
          done
          echo "Smoke test failed."
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### Azure deployment"
            echo "- Image: ghcr.io/straicy/cloud-teh_lab5-6:$IMAGE_TAG"
            echo "- URL: $APP_URL/common/healthcheck"
            echo "- Smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"